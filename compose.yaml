services:
  postgres:
    image: postgres:17-alpine
    container_name: analytical-engine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytical_engine}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-analytical_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Analytical_Engine/Dockerfile
    container_name: analytical-engine-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-analytical_engine};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      JwtSettings__Secret: ${JWT_SECRET:-SuperSecretKeyForDockerDeploymentAtLeast32Chars!}
      JwtSettings__Issuer: AnalyticalEngine
      JwtSettings__Audience: AnalyticalEngineClient
      JwtSettings__ExpirationMinutes: 120
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      SeedAdmin__Username: "admin"
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-SuperAdminPassword2026!}
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analytical-engine-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data: