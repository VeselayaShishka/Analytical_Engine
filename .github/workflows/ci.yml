name: Analytical Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (.NET 10 Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Analytical_Engine.sln

      - name: Build solution
        run: dotnet build Analytical_Engine.sln --no-restore --configuration Release

      - name: Run xUnit tests
        run: dotnet test Analytical_Engine.Tests/Analytical_Engine.Tests.csproj --no-build --configuration Release --verbosity normal